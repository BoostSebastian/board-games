name: Uppdatera från BoardGameGeek

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 1 * *' # första dagen varje månad

permissions:
  contents: write

concurrency:
  group: bgg-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Hämta data från BGG
        env:
          BGG_TOKEN: ${{ secrets.BGG_TOKEN }}
        run: node scripts/bgg-sync.mjs
      - name: Ladda ner omslagsbilder
        run: |
          python3 -m pip install --user --quiet pillow
          python3 scripts/bgg-images.py
      - name: Spara ändringar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games.json images
          git diff --cached --quiet || git commit -m "Uppdatera speldata från BoardGameGeek"
          git push
